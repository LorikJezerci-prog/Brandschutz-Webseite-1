# Lädt die Website nach jedem Push automatisch zu all-inkl hoch.
# Braucht drei Repository-Secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER   z. B. w0123456.kasserver.com
#   FTP_USERNAME der eigens angelegte FTP-Benutzer (nur Ordner der Domain)
#   FTP_PASSWORD dessen Passwort
# Zielordner: brandschutz-ried.de/ (so ist die Domain in KAS eingestellt).
# Abweichend per Repository-Variable FTP_DIR setzbar.
# Ohne Secrets wird nur gebaut und geprüft, nicht hochgeladen.
name: Website zu all-inkl hochladen

on:
  push:
    branches: [claude/project-thread-d9uamu, website-brandschutz-ried]
  workflow_dispatch:

concurrency:
  group: deploy-allinkl
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://www.brandschutz-ried.de
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:launch
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      # Einmalige Aufräumung: der erste Upload landete in der Wurzel statt im Domain-Ordner.
      - name: Alte Dateien in der FTP-Wurzel entfernen
        if: env.HAS_FTP == 'true'
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -e "set ftp:ssl-force true; set ssl:verify-certificate yes; cls -1; bye" "$FTP_SERVER" > root.txt
          cat root.txt
          if grep -qx ".ftp-deploy-sync-state.json" root.txt; then
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -e "set ftp:ssl-force true; set cmd:fail-exit false; rm -r -f _next _not-found 404 datenschutz impressum kontakt leistungen; rm -f .ftp-deploy-sync-state.json .htaccess 404.html __next.__PAGE__.txt __next._full.txt __next._tree.txt icon.svg index.html index.txt kontakt.php robots.txt sitemap.xml; rm -f brandschutz-ried.de/index.htm; cls -1; bye" "$FTP_SERVER"
          fi
      - name: Hochladen per FTPS
        if: env.HAS_FTP == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR || 'brandschutz-ried.de/' }}
        run: |
          command -v lftp >/dev/null || sudo apt-get install -y -qq lftp >/dev/null
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ssl:verify-certificate yes
          set net:max-retries 3
          set net:reconnect-interval-base 5
          mirror --reverse --delete --verbose=1 --parallel=3 --exclude-glob .ftp-deploy-sync-state.json ./out/ $FTP_DIR
          bye
          EOF
      - name: Live-Check
        if: env.HAS_FTP == 'true'
        continue-on-error: true
        run: |
          for h in brandschutz-ried.de www.brandschutz-ried.de; do
            echo "== https://$h/"
            curl -sS -m 20 -o page.html -w "HTTP %{http_code}, Ziel %{redirect_url}, SSL-Pruefung %{ssl_verify_result}\n" "https://$h/" || echo "::warning::HTTPS fuer $h fehlgeschlagen (Zertifikat?)"
            if grep -q "Brandschutz Ried" page.html 2>/dev/null; then echo "Seite gefunden"; else echo "::warning::Auf $h liegt nicht unsere Seite"; head -c 400 page.html 2>/dev/null; echo; fi
            echo | openssl s_client -connect "$h:443" -servername "$h" 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName 2>/dev/null || true
          done
          echo "== Formular (leere Anfrage, schickt keine Mail)"
          curl -sS -m 20 -X POST -H "Accept: application/json" -H "Origin: https://brandschutz-ried.de" -w "\nHTTP %{http_code}\n" https://brandschutz-ried.de/kontakt.php || true
      - name: Hinweis ohne Zugangsdaten
        if: env.HAS_FTP != 'true'
        run: echo "::notice::Gebaut und geprüft. Zum Hochladen die FTP-Secrets im Repository eintragen."
